name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Parity with the dashboard and the data rules. A failure here blocks the deploy.
      - run: npm test
      - run: npm run typecheck

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Set in GitHub: Settings > Secrets and variables > Actions. Never in the repo.
      # The account id is in apps/app/wrangler.jsonc (not secret); only the token is a secret.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check that deployment is set up
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "The CLOUDFLARE_API_TOKEN secret is not set yet: skipping deploy."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' apps/app/wrangler.jsonc; then
            echo "D1 database id is not filled in yet: skipping deploy."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Apply database migrations
        if: steps.ready.outputs.go == 'true'
        working-directory: apps/app
        run: npx wrangler d1 migrations apply veleggia --remote
      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        working-directory: apps/app
        run: npx wrangler deploy
